<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Mesic</title><style>
:root{--bg:#0d1015;--panel:#171b22;--line:#ffffff12;--muted:#a7adb9;--peach:#ffaf74;--pink:#ff679e;--lime:#d9ef7f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#29214a,transparent 30%),#090b10;color:#fff;font-family:Arial,sans-serif}.phone{width:min(100%,430px);min-height:100vh;margin:auto;background:linear-gradient(180deg,#12161e,#0b0d12);border-left:1px solid #ffffff0a;border-right:1px solid #ffffff0a;padding:18px 18px 98px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center;font-size:19px;font-weight:900}.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--peach),var(--pink));box-shadow:0 7px 20px #ff649c44}.icon{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:#bbc2ce;font-size:13px}.search{margin:18px 0;background:#20252e;border:1px solid #ffffff0b;border-radius:13px;padding:12px 14px;color:#9097a5;font-size:12px}.hero{height:174px;border-radius:23px;background:linear-gradient(135deg,#f8ac78,#ff6b9e 58%,#6935b8);position:relative;overflow:hidden;padding:20px}.hero:after,.hero:before{content:'';position:absolute;border:12px solid #fff3;border-radius:50%;height:150px;width:150px;right:-55px;top:-45px}.hero:before{height:85px;width:85px;right:48px;top:85px;border-color:#fff2}.hero b{font-size:12px;letter-spacing:1.5px}.hero h1{font-size:26px;line-height:1;margin:9px 0;max-width:230px;letter-spacing:-1px}.hero p{font-size:12px;margin:0;color:#fffD;max-width:235px;line-height:1.4}.hero button{position:absolute;bottom:18px;border:0;border-radius:10px;background:#15121b;color:#fff;padding:10px 13px;font-weight:bold;font-size:12px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.row h2{font-size:16px;margin:0}.row span{font-size:11px;color:var(--peach)}.trending{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:0;padding:0;background:none;color:#fff;text-align:left;cursor:pointer}.cover{height:126px;background:var(--g);border-radius:17px;position:relative;overflow:hidden;box-shadow:inset 0 -45px 35px #0006}.cover:before{content:'♫';position:absolute;right:12px;bottom:-9px;color:#fff9;font-size:60px;font-weight:bold}.cover b{position:absolute;left:12px;bottom:12px;z-index:1;font-size:13px}.card small{display:block;color:var(--muted);font-size:11px;margin:7px 2px}.recent{border:1px solid var(--line);border-radius:17px;background:#151920;overflow:hidden}.song{width:100%;border:0;color:#fff;background:transparent;padding:11px 12px;display:grid;grid-template-columns:39px 1fr 25px;gap:11px;align-items:center;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}.song:last-child{border:0}.song.active{background:#ffffff0a}.mini{width:39px;height:39px;border-radius:11px;background:var(--g);display:grid;place-items:center}.song b{font-size:12px}.song small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.dots{color:#9da4b0;font-size:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:72px;background:#151920f5;border-top:1px solid var(--line);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);z-index:3}.nav button{border:0;background:none;color:#858d9b;font-size:10px;cursor:pointer}.nav button strong{font-size:18px;display:block;margin-bottom:3px}.nav button.active{color:var(--peach)}.player{display:none;position:fixed;inset:0;z-index:5;background:linear-gradient(180deg,#242d38,#11141c);padding:20px 22px}.player.show{display:block}.close{border:0;background:#ffffff12;color:white;height:35px;width:35px;border-radius:50%;font-size:17px;cursor:pointer}.now-label{text-align:center;color:#c5cbd4;font-size:11px;margin-top:-24px}.big-cover{height:340px;border-radius:28px;background:var(--g);margin:35px 0 24px;position:relative;overflow:hidden;box-shadow:0 28px 60px #0006}.big-cover:after{content:'♫';font-size:165px;position:absolute;right:28px;bottom:-35px;color:#fff8}.big-cover:before{content:'';height:175px;width:175px;border:20px solid #fff2;border-radius:50%;position:absolute;left:-42px;top:-33px}.track-name{font-size:22px;margin:0}.artist{color:#bdc3cd;font-size:13px;margin:6px 0 20px}.progress{height:4px;background:#ffffff22;border-radius:7px}.progress i{display:block;width:0;height:100%;background:var(--peach);border-radius:7px}.times{display:flex;justify-content:space-between;color:#aab0bb;font-size:10px;margin:7px 0 25px}.play-controls{display:flex;align-items:center;justify-content:center;gap:28px}.play-controls button{border:0;background:none;color:white;font-size:22px;cursor:pointer}.play-controls .main{height:58px;width:58px;border-radius:50%;background:var(--peach);color:#1c1721;font-size:20px}@media(min-width:560px){body{padding:25px}.phone{min-height:850px;border-radius:28px;box-shadow:0 25px 80px #0008}.nav{bottom:25px;border-radius:0 0 28px 28px}.player{width:430px;left:50%;right:auto;transform:translateX(-50%);min-height:850px;border-radius:28px}}
</style></head><body><main class="phone"><header class="top"><div class="brand"><span class="logo">♫</span>My Mesic</div><div class="icon">⌕</div></header><div class="search">⌕ &nbsp; Search your vibe</div><section class="hero"><b>MY DAILY MIX</b><h1>Play the colour of your mood.</h1><p>Original music, built in for you. Free and no ads.</p><button id="mix">▶ Play my mix</button></section><div class="row"><h2>Trending for you</h2><span>See all</span></div><section class="trending"><button class="card" data-id="0"><div class="cover" style="--g:linear-gradient(135deg,#f7bb78,#f0649a)"><b>Sunset Love</b></div><small>Love · 8 songs</small></button><button class="card" data-id="2"><div class="cover" style="--g:linear-gradient(135deg,#7355d7,#e45aa1)"><b>Rise & Run</b></div><small>Motivation · 8 songs</small></button></section><div class="row"><h2>Recently played</h2><span id="count">8 sounds</span></div><section class="recent" id="list"></section></main><nav class="nav"><button class="active"><strong>⌂</strong>Home</button><button><strong>⌕</strong>Search</button><button id="openPlayer"><strong>♫</strong>Player</button><button><strong>☻</strong>Profile</button></nav><section class="player" id="player"><button class="close" id="close">⌄</button><div class="now-label">NOW PLAYING</div><div class="big-cover" id="bigCover" style="--g:linear-gradient(135deg,#f7bb78,#f0649a)"></div><h1 class="track-name" id="nowTitle">Choose a song</h1><p class="artist" id="nowArtist">My Mesic Original</p><div class="progress"><i id="progress"></i></div><div class="times"><span>0:00</span><span>0:04</span></div><div class="play-controls"><button id="back">↶</button><button class="main" id="toggle">▶</button><button id="next">↷</button></div></section><script>
const tracks=[['Sunset Love','Love','linear-gradient(135deg,#f7bb78,#f0649a)'],['Pink Letter','Love','linear-gradient(135deg,#fe849d,#9e62df)'],['Rise & Run','Motivation','linear-gradient(135deg,#7355d7,#e45aa1)'],['Brave Morning','Motivation','linear-gradient(135deg,#f8b344,#f36b59)'],['Blue Rain','Chill','linear-gradient(135deg,#4fb6d7,#496cc1)'],['Moon Window','Chill','linear-gradient(135deg,#31518d,#a455c0)'],['Little Spark','Happy','linear-gradient(135deg,#e5d46b,#f4808d)'],['Rainbow Walk','Happy','linear-gradient(135deg,#e269ce,#735bd3)']].map((x,i)=>({title:x[0],mood:x[1],g:x[2],id:i}));let current=0,ctx,playing=false,timer;const list=document.querySelector('#list'),player=document.querySelector('#player'),progress=document.querySelector('#progress');function notes(m){return{Love:[262,330,392,523,392,330,294,330],Motivation:[392,494,587,784,587,659,784,880],Chill:[220,247,294,247,220,196,247,294],Happy:[523,659,784,659,880,784,659,523]}[m]}function stop(){clearTimeout(timer);playing=false;progress.style.width='0';document.querySelector('#toggle').textContent='▶'}function sound(t){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();stop();playing=true;let arr=notes(t.mood),now=ctx.currentTime,step=.42;arr.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),at=now+i*step;o.type=i%3?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.14,at+.03);g.gain.exponentialRampToValueAtTime(.0001,at+step-.04);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+step)});document.querySelector('#toggle').textContent='❚❚';progress.style.transition=`width ${arr.length*step}s linear`;requestAnimationFrame(()=>progress.style.width='100%');timer=setTimeout(()=>playing&&sound(t),arr.length*step*1000)}function select(i,open=true){current=(i+tracks.length)%tracks.length;let t=tracks[current];document.querySelector('#nowTitle').textContent=t.title;document.querySelector('#nowArtist').textContent=t.mood+' · My Mesic Original';document.querySelector('#bigCover').style.setProperty('--g',t.g);if(open)player.classList.add('show');sound(t);render()}function render(){list.innerHTML=tracks.slice(0,5).map(t=>`<button class="song ${t.id===current?'active':''}" data-id="${t.id}"><span class="mini" style="--g:${t.g}">♫</span><span><b>${t.title}</b><small>${t.mood} · My Mesic Original</small></span><span class="dots">⋮</span></button>`).join('')}list.onclick=e=>{let x=e.target.closest('.song');if(x)select(+x.dataset.id)};document.querySelector('#mix').onclick=()=>select(0);document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>select(+x.dataset.id));document.querySelector('#close').onclick=()=>player.classList.remove('show');document.querySelector('#openPlayer').onclick=()=>player.classList.add('show');document.querySelector('#toggle').onclick=()=>playing?stop():sound(tracks[current]);document.querySelector('#next').onclick=()=>select(current+1);document.querySelector('#back').onclick=()=>select(current-1);render();
</script></body></html>
