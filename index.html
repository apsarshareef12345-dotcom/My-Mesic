dding-bottom:3px}.album{border:0;background:none;color:#fff;padding:0;min-width:130px;text-align:left;cursor:pointer}.cover{height:126px;border-radius:17px;background:center/cover var(--g);position:relative;overflow:hidden;box-shadow:inset 0 -50px 45px #0008}.cover:after{content:'▶';position:absolute;bottom:10px;right:10px;height:31px;width:31px;border-radius:50%;display:grid;place-items:center;background:#ffffffdd;color:#1e1e27;font-size:11px}.cover b{position:absolute;left:11px;bottom:12px;z-index:1;font-size:13px;max-width:90px}.album small{font-size:10px;color:var(--muted);margin:7px 2px;display:block}.filters{display:flex;gap:7px;overflow:auto;margin:6px 0 12px}.filters button{border:1px solid var(--line);border-radius:30px;background:#ffffff08;color:#bdc5d0;padding:8px 11px;font-size:11px;white-space:nowrap;cursor:pointer}.filters button.active{background:#fff;color:#17151c;border-color:#fff}.queue{border:1px solid var(--line);border-radius:17px;background:#141820;overflow:hidden}.song{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:#fff;padding:11px;display:grid;grid-template-columns:40px 1fr 29px;gap:11px;align-items:center;text-align:left;cursor:pointer}.song:last-child{border:0}.song:hover{background:#ffffff09}.thumb{height:40px;width:40px;border-radius:11px;background:center/cover #32213c}.song b{font-size:12px}.song small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.heart{border:0;background:none;color:#818a9a;font-size:18px;cursor:pointer}.heart.on{color:var(--pink)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);height:72px;width:min(100%,430px);display:grid;grid-template-columns:repeat(4,1fr);background:#12161df5;border-top:1px solid var(--line);backdrop-filter:blur(15px);z-index:3}.nav button{border:0;background:none;color:#87909f;font-size:10px;cursor:pointer}.nav strong{display:block;font-size:17px;margin-bottom:3px}.nav button.active{color:var(--orange)}.player{display:none;position:fixed;z-index:8;inset:0;margin:auto;width:min(100%,430px);min-height:100vh;background:linear-gradient(#1c2430,#0e1017);padding:18px}.player.show{display:block}.player-head{display:flex;align-items:center;justify-content:space-between}.player-head b{font-size:11px;letter-spacing:1px}.player-cover{margin:29px 0 22px;aspect-ratio:1;border-radius:25px;background:center/cover #311d3e;position:relative;overflow:hidden;box-shadow:0 25px 60px #0009}.player-cover:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0006,transparent 60%)}.iframe-wrap{display:none;margin-top:15px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#050505}.iframe-wrap.open{display:block}.iframe-wrap iframe{height:100%;width:100%;border:0}.song-title{font-size:22px;margin:0}.sub{font-size:12px;color:#b1b8c3;margin:7px 0 17px}.progress{height:4px;background:#ffffff20;border-radius:9px}.progress i{display:block;width:37%;height:100%;background:var(--orange);border-radius:9px}.time{display:flex;justify-content:space-between;font-size:10px;color:#9ea6b1;margin:7px 0 20px}.controls{display:flex;align-items:center;justify-content:center;gap:27px}.controls button{border:0;background:none;color:#fff;font-size:20px;cursor:pointer}.controls .play{height:56px;width:56px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--pink));color:#291a25}.watch{display:block;text-align:center;margin-top:23px;text-decoration:none;border:1px solid #ffffff22;border-radius:12px;color:#fff;padding:12px;font-size:12px;font-weight:800}@media(min-width:600px){body{padding:25px}.app{min-height:860px;border-radius:28px;box-shadow:0 25px 85px #0009}.nav{bottom:25px;border-radius:0 0 28px 28px}.player{min-height:860px;border-radius:28px}}
</style></head><body><main class="app"><header class="header"><div class="brand"><span class="logo">♫</span>My Mesic</div><div class="icons"><button>⌕</button><button>☻</button></div></header><div class="search">⌕ &nbsp; Search your Telugu & Hindi favourites</div><section class="mix"><small>YOUR YOUTUBE JUKEBOX</small><h1>All your favourite vibes.</h1><p>Tap a song to play it in your personal music player.</p><button id="startMix">▶ Play My Mix</button></section><div class="row"><h2>Popular albums</h2><span>For you</span></div><section class="albums"><button class="album" data-play="0"><div class="cover" style="--g:url('https://i.ytimg.com/vi/dOKQeqGNJwY/hqdefault.jpg')"><b>Telugu Love</b></div><small>Soft & romantic</small></button><button class="album" data-play="2"><div class="cover" style="--g:url('https://i.ytimg.com/vi/4_eEgJhsBMo/hqdefault.jpg')"><b>Power Run</b></div><small>Motivation</small></button><button class="album" data-play="6"><div class="cover" style="--g:url('https://i.ytimg.com/vi/fdubeMFwuGs/hqdefault.jpg')"><b>Hindi Gold</b></div><small>Feel good</small></button></section><div class="row"><h2>Jukebox queue</h2><span id="count"></span></div><section class="filters"><button class="active" data-filter="All">All</button><button data-filter="Telugu">Telugu</button><button data-filter="Hindi">Hindi</button><button data-filter="Love">Love</button><button data-filter="Motivation">Motivation</button></section><section class="queue" id="queue"></section></main><nav class="nav"><button class="active"><strong>⌂</strong>Home</button><button><strong>⌕</strong>Search</button><button id="openPlayer"><strong>♫</strong>Player</button><button><strong>☻</strong>Profile</button></nav><section class="player" id="player"><div class="player-head"><button class="round" id="close">⌄</button><b>NOW PLAYING</b><button class="round" id="likeTop">♡</button></div><div class="player-cover" id="playerCover"></div><h1 class="song-title" id="playerTitle">Choose a song</h1><p class="sub" id="playerSub">My Mesic Jukebox</p><div class="progress"><i></i></div><div class="time"><span>0:00</span><span>YouTube</span></div><div class="controls"><button id="previous">↶</button><button class="play" id="play">▶</button><button id="next">↷</button></div><div class="iframe-wrap" id="videoBox"><iframe id="video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="YouTube music"></iframe></div><a class="watch" id="watch" target="_blank" rel="noopener">Open and play in YouTube ↗</a></section><script>
const songs=[['Inthandham','Sita Ramam','Telugu','Love','dOKQeqGNJwY'],['Samajavaragamana','Ala Vaikunthapurramuloo','Telugu','Love','tflQ33g6I8I'],['Naatu Naatu','RRR','Telugu','Motivation','4_eEgJhsBMo'],['Kesariya','Brahmāstra','Hindi','Love','BddP6PYo2gs'],['Heeriye','Jasleen Royal','Hindi','Love','RLzC55ai0eo'],['Apna Bana Le','Bhediya','Hindi','Love','ElZfdU54Cp8'],['Ilahi','Yeh Jawaani Hai Deewani','Hindi','Motivation','fdubeMFwuGs'],['Aarambh Hai Prachand','Gulaal','Hindi','Motivation','b2gqbxlt32E']].map((x,i)=>({title:x[0],artist:x[1],lang:x[2],mood:x[3],id:x[4],n:i}));let current=0,filter='All',liked=new Set(),playing=false;const queue=document.querySelector('#queue'),player=document.querySelector('#player'),video=document.querySelector('#video');function filtered(){return songs.filter(s=>filter==='All'||s.lang===filter||s.mood===filter)}function render(){let s=filtered();document.querySelector('#count').textContent=s.length+' songs';queue.innerHTML=s.map(x=>`<div class="song" data-n="${x.n}" role="button" tabindex="0"><span class="thumb" style="background-image:url('https://i.ytimg.com/vi/${x.id}/hqdefault.jpg')"></span><span><b>${x.title}</b><small>${x.artist} · ${x.lang}</small></span><button class="heart ${liked.has(x.n)?'on':''}" data-like="${x.n}">♥</button></div>`).join('');document.querySelectorAll('[data-like]').forEach(b=>b.onclick=e=>{e.stopPropagation();let n=+b.dataset.like;liked.has(n)?liked.delete(n):liked.add(n);render()})}function play(n){current=n;let s=songs[n];document.querySelector('#playerTitle').textContent=s.title;document.querySelector('#playerSub').textContent=s.artist+' · '+s.lang;document.querySelector('#playerCover').style.backgroundImage=`url('https://i.ytimg.com/vi/${s.id}/hqdefault.jpg')`;document.querySelector('#watch').href=`https://www.youtube.com/watch?v=${s.id}`;video.src=`https://www.youtube.com/embed/${s.id}?autoplay=1&playsinline=1&rel=0&enablejsapi=1`;document.querySelector('#videoBox').classList.add('open');document.querySelector('#play').textContent='❚❚';playing=true;player.classList.add('show')}queue.onclick=e=>{let b=e.target.closest('.song');if(b&&!e.target.closest('.heart'))play(+b.dataset.n)};document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(+b.dataset.play));document.querySelector('#startMix').onclick=()=>play(0);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#close').onclick=()=>player.classList.remove('show');document.querySelector('#openPlayer').onclick=()=>player.classList.add('show');document.querySelector('#next').onclick=()=>play((current+1)%songs.length);document.querySelector('#previous').onclick=()=>play((current+songs.length-1)%songs.length);document.querySelector('#play').onclick=()=>{if(!video.src){play(current);return}playing=!playing;video.contentWindow.postMessage(JSON.stringify({event:'command',func:playing?'playVideo':'pauseVideo',args:[]}),'*');document.querySelector('#play').textContent=playing?'❚❚':'▶'};document.querySelector('#likeTop').onclick=()=>{liked.has(current)?liked.delete(current):liked.add(current);document.querySelector('#likeTop').textContent=liked.has(current)?'♥':'♡';render()};render();
</script></body></html>
